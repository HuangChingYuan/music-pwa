<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>聲軌 Lyric Player</title>
  <meta name="description" content="本機音樂播放器：同步歌詞、背景播放、可離線安裝">
  <meta name="theme-color" content="#121110">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="聲軌">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body data-tab="library">
  <!-- 圖示 sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 6.2v11.6a.9.9 0 0 1-1.4.75L9.6 12.75a.9.9 0 0 1 0-1.5l8-5.8a.9.9 0 0 1 1.4.75Z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 6.2v11.6a.9.9 0 0 0 1.4.75l8-5.8a.9.9 0 0 0 0-1.5l-8-5.8A.9.9 0 0 0 5 6.2Z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h4v4M4 20 20 4M20 16v4h-4M15 15l5 5M4 4l5 5"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
    <symbol id="i-disc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-lyrics" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h12M4 11h16M4 16h9"/><circle cx="18" cy="17.5" r="2.2"/><path d="M20.2 17.5V11"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  </svg>

  <div class="backdrop" aria-hidden="true"><div class="backdrop-art"></div></div>

  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>聲軌</div>
    <div class="top-actions">
      <button class="btn ghost" id="installBtn" hidden><svg><use href="#i-download"/></svg><span>安裝</span></button>
      <button class="btn ghost" id="addFolderBtn" title="匯入資料夾"><svg><use href="#i-folder"/></svg><span>資料夾</span></button>
      <button class="btn primary" id="addFilesBtn" title="匯入音樂與 LRC 歌詞檔"><svg><use href="#i-plus"/></svg><span>匯入</span></button>
    </div>
    <input type="file" id="fileInput" multiple accept="audio/*,.mp3,.m4a,.aac,.flac,.ogg,.oga,.opus,.wav,.webm,.lrc,.txt" hidden>
    <input type="file" id="folderInput" webkitdirectory multiple hidden>
    <input type="file" id="lrcInput" accept=".lrc,.txt,text/plain" hidden>
  </header>

  <main class="layout">
    <!-- 曲庫 -->
    <section class="pane lib" id="library" aria-label="曲庫">
      <div class="lib-head">
        <h1>曲庫 <span class="count" id="libCount"></span></h1>
        <label class="search">
          <svg><use href="#i-search"/></svg>
          <input type="search" id="searchInput" placeholder="搜尋歌名、歌手、專輯" autocomplete="off">
        </label>
      </div>
      <ul class="track-list" id="trackList" role="list"></ul>
      <div class="empty" id="emptyState" hidden>
        <div class="empty-mark" aria-hidden="true"></div>
        <p class="empty-title">還沒有任何音樂</p>
        <p class="empty-sub">匯入 MP3 / M4A / FLAC 等檔案；同名的 <code>.lrc</code> 會自動配對成同步歌詞。也可以直接把檔案拖進視窗。</p>
        <div class="empty-actions">
          <button class="btn primary" data-action="add-files"><svg><use href="#i-plus"/></svg><span>匯入音樂</span></button>
          <button class="btn ghost" id="demoBtn"><svg><use href="#i-play"/></svg><span>產生示範曲</span></button>
        </div>
      </div>
      <p class="storage" id="storageInfo"></p>
    </section>

    <!-- 播放中 + 歌詞 -->
    <section class="pane now" id="now" aria-label="播放中">
      <div class="now-info">
        <div class="art-wrap"><img class="art" id="art" alt="" hidden><div class="art-fallback" id="artFallback"><svg><use href="#i-disc"/></svg></div></div>
        <div class="meta">
          <h2 class="title" id="nowTitle">尚未播放</h2>
          <p class="artist" id="nowArtist">選一首歌開始</p>
        </div>
      </div>
      <div class="lyrics-wrap">
        <div class="lyrics-tools">
          <span class="lyrics-state" id="lyricsState"></span>
          <div class="offset" id="offsetCtl" hidden>
            <button class="chip" data-offset="-0.5" title="歌詞提早 0.5 秒">−0.5s</button>
            <span id="offsetVal">0.0s</span>
            <button class="chip" data-offset="0.5" title="歌詞延後 0.5 秒">+0.5s</button>
          </div>
          <button class="chip" id="loadLrcBtn" disabled>載入 LRC</button>
          <button class="chip icon" id="clearLrcBtn" title="移除歌詞" aria-label="移除歌詞" hidden><svg><use href="#i-trash"/></svg></button>
        </div>
        <div class="lyrics" id="lyrics" tabindex="0" aria-live="off"></div>
        <button class="resync" id="resyncBtn" hidden>回到目前歌詞</button>
      </div>
    </section>
  </main>

  <!-- 播放器 -->
  <footer class="player" id="player">
    <div class="bar-track">
      <span class="time" id="curTime">0:00</span>
      <input type="range" class="seek" id="seek" min="0" max="1000" value="0" step="1" aria-label="播放進度">
      <span class="time" id="durTime">0:00</span>
    </div>
    <div class="bar-main">
      <button class="mini" id="miniInfo" aria-label="開啟播放中">
        <img id="miniArt" alt="" hidden><span class="mini-fallback" id="miniFallback"><svg><use href="#i-disc"/></svg></span>
        <span class="mini-text"><b id="miniTitle">—</b><small id="miniArtist"></small></span>
      </button>
      <div class="controls">
        <button class="ic" id="shuffleBtn" aria-label="隨機播放" aria-pressed="false"><svg><use href="#i-shuffle"/></svg></button>
        <button class="ic" id="prevBtn" aria-label="上一首"><svg><use href="#i-prev"/></svg></button>
        <button class="ic play" id="playBtn" aria-label="播放"><svg><use href="#i-play"/></svg></button>
        <button class="ic" id="nextBtn" aria-label="下一首"><svg><use href="#i-next"/></svg></button>
        <button class="ic" id="repeatBtn" aria-label="重複：關閉" data-mode="off"><svg><use href="#i-repeat"/></svg><span class="one">1</span></button>
      </div>
      <label class="volume"><svg><use href="#i-vol"/></svg><input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="音量"></label>
    </div>
  </footer>

  <nav class="tabs" aria-label="檢視切換">
    <button data-tab="library" aria-current="page"><svg><use href="#i-list"/></svg>曲庫</button>
    <button data-tab="now"><svg><use href="#i-lyrics"/></svg>歌詞</button>
  </nav>

  <div class="drop-hint" id="dropHint" hidden><p>放開以匯入音樂與歌詞</p></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="metadata"></audio>
</body>
</html>
